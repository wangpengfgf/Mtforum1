name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.1"

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore cached signing key
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mtforum-release.keystore
          key: mtforum-release-keystore-v1

      - name: Prepare signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/mtforum-release.keystore"

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            STORE_PASSWORD="$ANDROID_STORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          else
            STORE_PASSWORD="mtforum-ci-signing"
            KEY_ALIAS="mtforum"
            KEY_PASSWORD="mtforum-ci-signing"
            if [ ! -f "$KEYSTORE" ]; then
              keytool -genkeypair \
                -keystore "$KEYSTORE" \
                -alias "$KEY_ALIAS" \
                -keyalg RSA \
                -keysize 4096 \
                -validity 10000 \
                -storepass "$STORE_PASSWORD" \
                -keypass "$KEY_PASSWORD" \
                -dname "CN=MT Forum, OU=CI, O=wangpengfgf, L=Unknown, ST=Unknown, C=CN"
            fi
          fi

          chmod 600 "$KEYSTORE"
          cat > key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$KEYSTORE
          EOF

      - name: Upload signing key backup
        uses: actions/upload-artifact@v4
        with:
          name: mtforum-signing-key-backup
          path: ${{ runner.temp }}/mtforum-release.keystore
          if-no-files-found: error
          retention-days: 7

      - name: Build release APK (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtforum-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
